# LoRA fine-tune of Gemma-4-12B on the normalized teacher trajectories. Runs under DDP;
# fits comfortably on a single 80GB GPU or a small multi-GPU node. Run with:
#   torchrun --nproc_per_node=<N> scripts/train_gemma4_full_sft.py --config configs/train/gemma4_12b_lora.yml
use_liger_flce: true
exp_name: gemma4-12b-lora
output_dir: ${OUTPUT_ROOT}/${exp_name}

model_id: google/gemma-4-12B-it
tokenizer_id: google/gemma-4-12B-it
attn_implementation: sdpa
dtype: bf16

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$'

dataset:
  data_files: data/processed/normalized_trajectories.jsonl
  max_seq_len: 16384
  cache_dir: data/processed/cache
  max_train_examples: 0
  eval_fraction: 0.03

optimizer:
  name: adamw_torch_fused
  weight_decay: 0.0
  lr: 1.0e-4
lr_scheduler:
  name: cosine
  warmup_ratio: 0.03

seed: 42
shuffle: true
batch_size: 1
epochs: 3
max_steps: -1
gradient_accumulation_steps: 2
gradient_checkpointing: true
max_grad_norm: 1.0
ddp_find_unused_parameters: false

wandb:
  project: cyberforge
  group: ${exp_name}
  job_type: lora_ddp
hub:
  upload_checkpoints: false
  repo_id: your-namespace/gemma4-12b-lora
  private: false
  repo_type: model
  fail_on_error: false
log_every_n_steps: 1
save_steps: 200
save_total_limit: 3
save_only_model: true
save_final_model: true
eval_steps: 300
