exp_name: gemma4-31b-lora-text-24k
output_dir: /lab/hpc/redwing/wrk/anl31/vuljector-runs/${exp_name}

# Model
model_id: google/gemma-4-31B-it
tokenizer_id: google/gemma-4-31B-it
initial_model_id: ${INITIAL_MODEL_ID}
attn_implementation: sdpa
dtype: bf16

# LoRA: base frozen (can't catastrophically forget), low-rank adapters on attn+MLP.
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$'

# Dataset: NEW v4 data (1083 traj). Window 24576 = the OOM-SAFE larger window:
# it FITS the median trajectory (~20k tok) while keeping the 262k-vocab logits tensor
# (~13GB bf16 at batch 1) well within the 141GB H200 budget after the 62GB replicated
# base. (32k risks OOM: ~17-34GB logits + grad, no fused/chunked CE in the trainer.)
dataset:
  data_files: data/processed/normalized_trajectories_v4_text.jsonl
  max_seq_len: 24576
  cache_dir: data/processed/cache_v4_24k
  max_train_examples: 0
  eval_fraction: 0.03

# Optimizer/scheduler -- LoRA tolerates a higher LR than full-FT.
optimizer:
  name: adamw_torch_fused
  weight_decay: 0.0
  lr: 1.0e-4
lr_scheduler:
  name: cosine
  warmup_ratio: 0.03

# Training -- DDP (base replicated per GPU, frozen). gradient_checkpointing on.
# grad_accum bumped to 4 (vs 16k's 2): longer seqs -> the per-step activation/logit peak
# is higher, so keep the per-microbatch work at batch=1 and accumulate more for a stable
# effective batch (4 GPUs x 1 x 4 = 16... DDP world size sets the rest).
seed: 42
shuffle: true
batch_size: 1
epochs: 3
max_steps: -1
gradient_accumulation_steps: 4
gradient_checkpointing: true
max_grad_norm: 1.0
ddp_find_unused_parameters: false

# Logging/checkpointing -- adapters are tiny, so saves are cheap/fast.
wandb:
  project: vuljector-secbench
  group: ${exp_name}
  job_type: lora_ddp
  key_file: ${WANDB_KEY_FILE}
hub:
  upload_checkpoints: false
  repo_id: AmL-hug/gemma4-31b-lora
  token_file: ${HF_KEY_FILE}
  private: false
  repo_type: model
  fail_on_error: false
log_every_n_steps: 1
save_steps: 250
save_total_limit: 2
save_only_model: true
save_final_model: true
eval_steps: 500
